<!-- Agent ossec.conf syscheck section: watch what matters, ignore churn. -->
<syscheck>
  <frequency>43200</frequency>
  <scan_on_start>yes</scan_on_start>

  <!-- Real-time on high-value paths -->
  <directories realtime="yes" check_all="yes" report_changes="yes">/etc,/usr/local/bin</directories>
  <directories check_all="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>

  <!-- Noisy, low-value churn -->
  <ignore>/etc/mtab</ignore>
  <ignore>/etc/resolv.conf</ignore>
  <ignore>/etc/hosts.deny</ignore>
  <ignore type="sregex">\.swp$</ignore>
  <ignore type="sregex">/var/lib/(docker|containerd|kubelet)/</ignore>

  <!-- Frequently-written files: alert only on the first change in a window -->
  <nodiff>/etc/ssl/private.key</nodiff>
</syscheck>
