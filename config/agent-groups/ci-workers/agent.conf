<!-- Shared config pushed to agents in the 'ci-workers' group:
       /var/ossec/etc/shared/ci-workers/agent.conf on the manager.
     Build agents churn files constantly; FIM there is mostly noise. -->
<agent_config os="Linux">
  <syscheck>
    <!-- Scan less often, and skip build/cache paths that change on every job. -->
    <frequency>86400</frequency>
    <ignore>/home/jenkins/workspace</ignore>
    <ignore>/var/lib/jenkins/workspace</ignore>
    <ignore>/var/lib/docker</ignore>
    <ignore>/var/lib/containerd</ignore>
    <ignore type="sregex">/tmp/(jenkins|build)[^/]*/</ignore>
    <!-- Still watch what matters on a build host. -->
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/ssh,/etc/sudoers.d</directories>
    <directories check_all="yes">/usr/local/bin</directories>
  </syscheck>
</agent_config>
