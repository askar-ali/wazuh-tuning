<!-- Manager ossec.conf. Block only brute force, and never infrastructure addresses. -->
<global>
  <!-- Alert-side allow list: these sources are never acted on by active response. -->
  <white_list>192.0.2.0/28</white_list>
  <white_list>198.51.100.10</white_list>
</global>

<!-- Wrapper that re-checks /var/ossec/etc/protected-sources.list on the agent
     before delegating to firewall-drop (defence in depth for CI/CD workers). -->
<command>
  <name>safe-block</name>
  <executable>safe-block.sh</executable>
  <timeout_allowed>yes</timeout_allowed>
</command>

<active-response>
  <command>safe-block</command>
  <location>local</location>
  <rules_id>5712,5763</rules_id>   <!-- sshd brute force only -->
  <timeout>600</timeout>           <!-- auto-unblock after 10 minutes -->
</active-response>
