<!-- Manager ossec.conf. Block only brute force, and never infra addresses. -->
<global>
  <!-- CI/CD workers, monitoring, bastion: never auto-blocked. -->
  <white_list>192.0.2.0/28</white_list>
  <white_list>198.51.100.10</white_list>
</global>

<active-response>
  <command>firewall-drop</command>
  <location>local</location>
  <rules_id>5712,5763</rules_id>   <!-- sshd brute force only -->
  <timeout>600</timeout>           <!-- auto-unblock after 10 minutes -->
</active-response>
